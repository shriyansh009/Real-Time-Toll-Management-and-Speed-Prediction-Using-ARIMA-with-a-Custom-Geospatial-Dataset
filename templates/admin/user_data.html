<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <style>
           body{
      background-color: #ffffff;
      color: rgb(0, 0, 0);
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 20px;
    }
    .heading{
    background: #4158d0;
    color: #ffffff; 
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 50px;
}
.center{
  width: 100%;
  background: #ffffff;
  border-radius: 20px;
  /* box-shadow: 0px 15px 20px rgba(0,0,0,0.1); */
}
      </style>
    
    <div class="heading">
      <h1> Vehicles Traveled History</h1>
     </div>
    
     <div class="container">
      <div class="center">
        <table class="table table-bordered text-dark">
          <thead>
            <tr>
              <th scope="col">Sr.No</th>
              <th scope="col">User-id</th>
              <th scope="col">From</th>
              <th scope="col"></th>
              <th scope="col">To</th>
              <th scope="col">Vehicle</th>
              <th scope="col">Distance</th>
              <th scope="col">fine</th>
              <th scope="col">Toll-Tax</th>
              <th scope="col">Total</th>
            </tr>
          </thead>
          <tbody> 
            {% for bill in bills %}
            <tr>
              <th scope="row">{{loop.index}}</th>
              <td>{{bill.user_id}}</td>
              <td>{{bill.destination1}}</td>
              <td ><img width="16" height="16" src="https://img.icons8.com/cotton/64/000000/double-path.png" alt="double-path"/></td>
              <td>{{bill.destination2}}</td>
              <td>{{bill.vehicle}}</td>
              <td>{{bill.distance}}</td>
              <td>{{bill.fine}}</td>
              <td>{{bill.tax}}</td>
              <td style="color: rgb(125, 206, 2);">{{bill.total}}</td>
            </tr>
            
            {% endfor %}
          </tbody>
      </table>
      </div>
     </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
