<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png')}}">
</head>
<body>
  <style>
    body{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color:#ffffff;
      color: rgb(0, 0, 0);
    }
    nav{
           width: 100%;
           height: 60px;
           background: #4158d0;
           z-index: 100;
           box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
           transition: all 0.5s ease;
        }
        nav .sidebar-button a{
            margin: 10px;
            color: #fff;
        }

        nav .sidebar-button {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            justify-content: space-between;
        }
     .container{
      display: flex;
      margin-top: 5%;
      justify-content: center;
      align-items: center;
      gap: 20px;
     }
     .box{
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0px 15px 20px rgba(0,0,0,0.1);
     }
     .title{
      font-weight: 500;
      line-height: 1.6;
      text-transform: uppercase;
      padding: 20px;
      color: #ffffff;
      background: linear-gradient(-135deg, #c850c0, #4158d0);
      align-items: center;
      justify-content: space-between;
     
     }
     .box form{
      padding: 20px;
     }
     .image{
      width: 100%;
      height: 180px;
      margin-bottom: 20%;
      border-radius: 50px;
     }
  </style>
        <nav>
          <div class="sidebar-button">
            <a href="{{ url_for('ad_home') }}" style="text-decoration: none; ">Dashboard</a>
            <a class="btn btn-primary" href="{{url_for('ad_home')}}" role="button">back</a>
          </div>
        </nav>
      {% with messages = get_flashed_messages() %}
         {% if messages %}
          {% for message in messages %}
             <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{ message }}   
               <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
             </div> 

                     {% endfor %}
          {% endif %}
          

         {% endwith %} 

         <div class="container">
          <div class="box">
            <div class="title"> <h1> <img width="75" height="75" src="https://img.icons8.com/parakeet-line/96/FFFFFF/user-shield.png" alt="user-shield"/>Admin</h1></div>
        
        <form method="POST" action="">
          <label for="loc" style="font-size: xx-large; margin-top: 20px;">Route :</label><br>
          <select  style="width: 180px; height: 50px; margin-top: 20px; border-radius: 5px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); margin-right: 20px; "id="loc1" name="loc1" >
          <option style="color: rgb(0, 0, 0);" selected> Location1...</option>
          <option style="color: rgb(0, 0, 0);" value="nagpur" >Nagpur</option>
          <option style="color: rgb(0, 0, 0);" value="wardha">Wardha</option>
          <option style="color: rgb(0, 0, 0);" value="karanja">Karanja</option>
          </select>To
          <select  style="width: 180px; height: 50px; margin-top: 20px; border-radius: 5px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); margin-left: 20px;"id="loc2" name="loc2" >
            <option style="color: rgb(0, 0, 0);" selected> Location2...</option>
            <option style="color: rgb(0, 0, 0);" value="nagpur" >Nagpur</option>
            <option style="color: rgb(0, 0, 0);" value="wardha">Wardha</option>
            <option style="color: rgb(0, 0, 0);" value="karanja">Karanja</option>
            </select><br><br>

          <label for="Vehicle_type" style="font-size: xx-large;">Type Of Vehicle and Rates(/Km):</label><br><br>
          <label for="bike" style="font-size: x-large;">Bike :</label>
          <input type="float"  style="width: 100px; height: 35px; margin-top: 20px; border-radius: 5px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); margin-left: 50px;" id="bike"  name="bike" placeholder="Rate">
            /Km<br>
          <label for="car" style="font-size: x-large;">Car :</label>
          <input type="float"  style="width: 100px; height: 35px; margin-top: 20px; border-radius: 5px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0);margin-left: 60px; " id="car"  name="car" placeholder="Rate">
          /Km   <br>
          <label for="truck" style="font-size: x-large;">Truck :</label>
          <input type="float"  style="width: 100px; height: 35px; margin-top: 20px; border-radius: 5px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); margin-left: 40px;" id="truck"  name="truck" placeholder="Rate">
          /Km<br>
          <label for="others" style="font-size: x-large;">Others :</label>
          <input type="float"  style="width: 100px; height: 35px; margin-top: 20px; border-radius: 5px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); margin-left: 25px; " id="others"  name="others" placeholder="Rate">
          /Km<br><br>
        
          <button type="submit"  class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </div>

             <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
      </body>
    </html>
