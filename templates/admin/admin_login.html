<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login_ad page</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="icon" href="{{ url_for('static', filename='images/logo.png')}}">
  <link rel="stylesheet" href="{{ url_for('static',filename='style/form.css')}}">
</head>
<body>

  
    
      {% with messages = get_flashed_messages() %}
      {% if messages %}
       {% for message in messages %}
          <div class="alert alert-warning alert-dismissible fade show" role="alert">
             {{ message }}   
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div> 

                  {% endfor %}
       {% endif %}
       {% endwith %} 
       <div class="center"> 
        <div class="wrapper">
           <div class="title">
              Admin Login
           </div>
<div class="container">
    
          <br><br>
            <form action="/admin_login" method="POST">
                <div class="form-group">
                <label for="email" class="fs-5">Email:</label>
                <input type="email" style=" height: 35px;  border-radius: 5px ;border:none; background: rgba(0, 0, 0, 0.06); color: rgb(0, 0, 0); " class="form-control" id="email" placeholder="Enter email" name="email">
                </div>
                <div class="form-group">
                <label for="pwd" class="fs-5">Password:</label>
                <input type="password" style=" height: 35px;  border-radius: 5px ;border:none; background: rgba(0, 0, 0, 0.06); color: rgb(0, 0, 0); " class="form-control" id="pwd" placeholder="Enter password" name="password">
                </div>
                <div class="form-group">
                    <label for="pwd" class="fs-5">Admin Password:</label>
                    <input type="password" style=" height: 35px;  border-radius: 5px ;border:none; background: rgba(0, 0, 0, 0.06); color: rgb(0, 0, 0); " class="form-control" id="pwd1" placeholder="Enter password" name="pwd1">
                    </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>

    </div>
  
</div>
        


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
