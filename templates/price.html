<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>price</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
  <style>
    body{
      background-color: #ffffff;
      color: rgb(0, 0, 0);
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 20px;
    }
    .heading{
    background: #4158d0;
    color: #ffffff; 
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 50px;
}
.center{
  width: 100%;
  background: #ffffff;
  border-radius: 20px;
  /* box-shadow: 0px 15px 20px rgba(0,0,0,0.1); */
}
  </style>
     <div class="heading">
      <h1>Current Rate Charging For Vehicles</h1>
     </div>
  <div class="container">
     <div class="center">
      <table class="table text-dark">
        <thead>
          <tr>
            <th scope="col">Sr.No</th>
            <th scope="col">From</th>
            <th scope="col"></th>
            <th scope="col">To</th>
            <th scope="col">Bike</th>
            <th scope="col">Car</th>
            <th scope="col">Truck</th>
            <th scope="col">Others</th>
          </tr>
        </thead>
        <tbody>
          {% for new_data in new_data %}

          <tr>
            <th scope="row">{{loop.index}}</th>
            <td>{{new_data.location1}}</td>
            <td ><img width="16" height="16" src="https://img.icons8.com/cotton/64/000000/double-path.png" alt="double-path"/></td>
            <td>{{new_data.location2}}</td>
            <td>{{new_data.Bike}}rs/Km</td>
            <td>{{new_data.Car}}rs/Km</td>
            <td>{{new_data.Truck}}rs/Km</td>
            <td>{{new_data.Others}}rs/Km</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>


      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
