<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simulation_form</title>
  <link rel="icon" href="{{ url_for('static', filename='images/logo.png')}}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
  <style>
    body{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color:#ffffff;
      color: rgb(0, 0, 0);
    }
    nav{
           width: 100%;
           height: 60px;
           background: #4158d0;
           z-index: 100;
           box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
           transition: all 0.5s ease;
        }
        nav .sidebar-button a{
            margin: 10px;
            color: #fff;
        }

        nav .sidebar-button {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            justify-content: space-between;
        }
     .container{
      display: flex;
      margin-top: 5%;
      justify-content: center;
      align-items: center;
      gap: 20px;
     }
     .box{
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0px 15px 20px rgba(0,0,0,0.1);
     }
     .title{
      font-weight: 500;
      line-height: 1.6;
      text-transform: uppercase;
      padding: 20px;
      color: #ffffff;
      background: linear-gradient(-135deg, #c850c0, #4158d0);
      align-items: center;
      justify-content: space-between;
     
     }
     .box form{
      padding: 20px;
     }
     .image{
      width: 100%;
      height: 180px;
      margin-bottom: 20%;
      border-radius: 50px;
     }

       #loading-gif{
       position: fixed;
	     top: 0;
	     left: 0;
	     margin: auto;
	     width: 100vw;
	     height: 100vh;
	     background: #797979;
	     opacity: 1;
	     -webkit-transition: all 0.3s ease;
	     -moz-transition: all 0.3s ease;
	     transition: all 0.3s ease;
	     transition-duration: 500ms;
	     -webkit-transition-duration: 500ms;
	     transition-timing-function: cubic-bezier(0.86, 0, 0.07, 1);
	     -webkit-transition-timing-function: cubic-bezier(0.86, 0, 0.07, 1);
	     z-index: 99;
	     transition-delay: 0.65s;
       }
    
       
  </style>

  <nav>
    <div class="sidebar-button">
      <a href="{{ url_for('profile') }}" style="text-decoration: none; ">Dashboard</a>
      <a class="btn btn-primary" href="{{url_for('home')}}" role="button">back</a>
    </div>
  </nav>
           
          <div id="msg" style="margin-left:30px ; margin-top: 10px; z-index: 9999;"></div>
          <img id="loading-gif" src="static/images/simulation.gif" style="display: none;" alt="Loading">
          
          {% with messages = get_flashed_messages() %}
          {% if messages %}
           {% for message in messages %}
              <div class="alert alert-warning alert-dismissible fade show" role="alert">
                 {{ message }}   
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div> 
 
                      {% endfor %}
           {% endif %}
           
 
          {% endwith %} 

       
      <div class="container">
        <div class="box">
          <div class="title"> <h1> <img width="64" height="64" src="https://img.icons8.com/glyph-neue/64/FFFFFF/map-marker.png" alt="map-marker"/>
            Simulation Details</h1></div>
            <form method="post" action="{{ url_for('simulation') }}">
          
              <label for="DecimalInput" style="font-size: x-large; margin-top: 20px;">Coordinates:</label>
              <br>
              <select  style="width: 200px; height: 50px; margin-top: 20px;margin-right: 20px; border-radius: 10px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); "id="DecimalInput" name="DecimalInput">
                <option style="color: rgb(0, 0, 0);" value="nagpur">Nagpur</option>
                <option style="color: rgb(0, 0, 0);" value="wardha">Wardha</option>
                <option style="color: rgb(0, 0, 0);" value="karanja">karanja</option>
                </select>  to  
               <select  style="width: 200px; height: 50px; margin-top: 20px;margin-left: 20px; border-radius: 10px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); "id="DecimalInput1" name="DecimalInput1">
                <option style="color: rgb(0, 0, 0);" value="nagpur">Nagpur</option>
                <option style="color: rgb(0, 0, 0);" value="wardha">Wardha</option>
                <option style="color: rgb(0, 0, 0);" value="karanja">karanja</option>
                </select>
                <br><br>
              <label for="Vehicle_type" style="font-size: x-large;">Type Of Vehicle:</label><br>
              <select  style="width: 200px; height: 50px; margin-top: 20px; border-radius: 10px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); "id="Vehicle_type" name="Vehicle_type">
              <option style="color: rgb(0, 0, 0);" value="Car">Car</option>
              <option style="color: rgb(0, 0, 0);" value="Truck">Truck</option>
              <option style="color: rgb(0, 0, 0);" value="Bike">bike</option>
              <option style="color: rgb(0, 0, 0);" value="Others">Others</option>
              </select>
              <br><br>
              <label for="speed" style="font-size: x-large;">Speed Of Vehicle:</label><br>
              <select  style="width: 200px; height: 50px; margin-top: 20px; border-radius: 10px ;border:1px solid lightgrey; background: rgba(255,255,255,0.1); color: rgb(0, 0, 0); "id="Vehicle_type" name="Vehicle_type">
              <option style="color: rgb(0, 0, 0);" value="speed">Avg. Speed generated by System itself </option>
              </select>
    
              <br><br>
    
                <div style="display: flex;">
               <button class="btn btn-primary " id="simulation" type="submit">simulate</button>
            </div>
            </form>
          </div>
          <div class="box">
          <div class="image">
            <div class="image">{{image |safe}}</div>
          </div>
           </div>
        </div> 
      </div>

     
      
       <script>
        
        
        function generateText() {
  const textDiv = document.getElementById("msg"); 
  const loadingGif = document.getElementById('loading-gif'); // Get the div element
  textDiv.textContent = "the simluation is under process....(around 1min)";
  loadingGif.src = 'static/images/simulation.gif'; // Set GIF path
  loadingGif.style.display = 'inline';  // Set the text content
}

const button = document.getElementById("simulation");  // Get the button element
button.addEventListener("click", generateText); 
       </script>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
      </body>
    </html>
