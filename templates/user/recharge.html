<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge</title>
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png')}}">
    <link rel="stylesheet" href="{{ url_for('static',filename='style/style.css')}}">
</head>
<body>

  <style>
nav{
           width: 100%;
           height: 60px;
           background: #4158d0;
           z-index: 100;
           box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
           transition: all 0.5s ease;
        }
        nav .sidebar-button a{
            margin: 10px;
            color: #fff;
        }

        nav .sidebar-button {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            justify-content: space-between;
        }


  </style>
  <nav>
    <div class="sidebar-button">
      <a href="{{ url_for('profile') }}" style="text-decoration: none; ">Dashboard</a>
      <a class="btn btn-primary" href="{{url_for('home')}}" role="button">back</a>
    </div>
  </nav>

    <div class="bg-light py-5">
        <div class="container">
          <div class="row">
            <div class="col-sm-5 mx-auto">
              <div class="bg-white customRounded shadow-sm">
                <div class="p-3 border-bottom">Feel safe to pay</div>
                <div class="p-4">
                  <h6 class="mx-3 mb-3 text-secondary">Amount</h6>
                  <div class="border customRounded">
                    <div class="d-flex align-items-center justify-content-between p-3 customRounded">
                      <div>
                      <label for="customAmount" class="align-text-bottom ms-3">Enter Amount :</label>
                      </div>
                      <div class="border p-2 customRounded" style="max-width:108px"><input type="text" class="text-center form-control border-0 p-0" placeholder="0.00 Rs."></div>
                    </div>
                
                  </div>
                </div>
                <div class="px-4 pb-4">
                  <h6 class="mx-3 mb-3 text-secondary">Payment Method</h6>
                  <div class="border customRounded">
                    <div class="d-flex align-items-center justify-content-between p-3 customRounded">
                      <div class="d-flex align-items-center">
                        <button id="rzp-button1" style=" width: 200px;height: 50px; background-color: aquamarine;border: #0E1117; border-radius: 4px;">Pay With Razorpay</button>
                        </div>
                    </div>
                    <div class="border-top d-flex align-items-center justify-content-between p-3 ">
                      <div class="d-flex align-items-center">
                        <div id="paypal-button" style="margin-left: 5%; margin-top: 5%; height: 50px; width: 200px;" ></div>
                        <script src="https://www.paypalobjects.com/api/checkout.js"></script>
                    </div>
                      </div>
                      
                    </div>
                  </div>
                  <div class="border customRounded p-2 mt-3">
                    <textarea name="" id="" cols="10" rows="2" class="form-control border-0" placeholder="Message"></textarea>
                  </div>
                  <div class="text-end mt-4">
                    <a class="btn btn-primary w-15 m-4" href="{{url_for('profile')}}">Cancel</a>
                  </div>
                </div>
      
              </div>
            </div>
          </div>
        </div>
      </div>


      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "YOUR_KEY_ID", // Enter the Key ID generated from the Dashboard
    "amount": "50000", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
    "currency": "INR",
    "name": "Acme Corp", //your business name
    "description": "Test Transaction",
    "image": "https://example.com/your_logo",
    "order_id": "order_9A33XWu170gUtm", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
    "callback_url": "https://eneqd3r9zrjok.x.pipedream.net/",
    "prefill": { //We recommend using the prefill parameter to auto-fill customer's contact information especially their phone number
        "name": "demo name", //your customer's name
        "email": "demo1@example.com",
        "contact": "9000090000" //Provide the customer's phone number for better conversion rates 
    },
    "notes": {
        "address": "Razorpay Corporate Office"
    },
    "theme": {
        "color": "#3399cc"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
        </div>
        <div id="paypal-button" style="margin-left: 5%; margin-top: 5%; height: 40px;" ></div>
<script src="https://www.paypalobjects.com/api/checkout.js"></script>
<script>
var CREATE_PAYMENT_URL = 'https://my-store.com/paypal/create-payment';
var EXECUTE_PAYMENT_URL = 'https://my-store.com/paypal/execute-payment';
paypal.Button.render({
env: 'production', // Or 'sandbox'
commit: true, // Show a 'Pay Now' button
payment: function() {
return paypal.request.post(CREATE_PAYMENT_URL).then(function(data) {
return data.id;
});
},
onAuthorize: function(data) {
return paypal.request.post(EXECUTE_PAYMENT_URL, {
paymentID: data.paymentID,
payerID: data.payerID
}).then(function() {
// The payment is complete!
// You can now show a confirmation message to the customer
});
}
}, '#paypal-button');
</script>




    
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
